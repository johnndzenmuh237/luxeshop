<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — LuxeShop</title>
<style>
  :root{
    --ink:#1a1a2e; --ink-muted:#6b6b80; --ink-light:#a5a5b5;
    --line:#e6e6ec; --panel:#ffffff; --panel-alt:#f6f6f9;
    --accent:#e94560; --accent-soft:rgba(233,69,96,0.1);
    --success:#2cb67d; --success-soft:rgba(44,182,125,0.1);
    --error:#e5484d; --error-soft:rgba(229,72,77,0.1);
    --radius-lg:16px; --radius-md:10px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--panel-alt); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:2rem 1rem;
  }
  .box{ width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line);
        border-radius:var(--radius-lg); padding:2.5rem; }
  .brand{ display:flex; align-items:center; justify-content:center; gap:0.5rem; margin-bottom:1.5rem; }
  .logo-mark{ width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff;
              display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
  .logo-text{ font-weight:900; font-size:1.15rem; }
  .logo-text span{ color:var(--accent); }
  h1{ font-size:1.5rem; font-weight:900; text-align:center; margin:0 0 0.25rem; }
  .sub{ text-align:center; color:var(--ink-muted); font-size:0.9rem; margin:0 0 1.75rem; }
  label{ display:block; font-size:0.82rem; font-weight:600; margin-bottom:0.4rem; }
  .field{ margin-bottom:1rem; }
  input{ width:100%; padding:0.75em 0.9em; border-radius:var(--radius-md); border:1.5px solid var(--line);
         background:var(--panel); color:var(--ink); font-size:0.95rem; font-family:inherit; }
  input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .btn{ width:100%; padding:0.85em; border:none; border-radius:999px; background:var(--accent); color:#fff;
        font-weight:700; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:0.5rem; }
  .btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .btn:hover:not(:disabled){ filter:brightness(1.05); }
  .msg{ padding:0.75rem 1rem; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:1.25rem; display:none; gap:0.5rem; align-items:center; }
  .msg.error{ display:flex; background:var(--error-soft); border:1px solid rgba(229,72,77,0.25); color:var(--error); }
  .msg.success{ display:flex; background:var(--success-soft); border:1px solid rgba(44,182,125,0.25); color:var(--success); }
  .row{ display:flex; justify-content:space-between; align-items:center; font-size:0.85rem; margin-bottom:1.5rem; }
  .row a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .row label{ display:flex; align-items:center; gap:0.4rem; color:var(--ink-muted); cursor:pointer; margin:0; font-weight:400; }
  .row input{ width:auto; accent-color:var(--accent); }
  .foot{ text-align:center; margin-top:1.5rem; font-size:0.875rem; color:var(--ink-muted); }
  .foot a{ color:var(--accent); font-weight:700; text-decoration:none; }
  .foot a:hover{ text-decoration:underline; }
  .spinner{ width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
            border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="logo-mark">✦</div>
    <span class="logo-text">Luxe<span>Shop</span></span>
  </div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to view your orders and account</p>

  <div class="msg" id="msg"><span id="msgText"></span></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <div class="row">
      <label><input type="checkbox" id="remember"> Remember me</label>
      <a href="forgot-password.html">Forgot password?</a>
    </div>
    <button type="submit" class="btn" id="submitBtn">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Sign In</span>
    </button>
  </form>

  <div class="foot">Don't have an account? <a href="signup.html">Create one free →</a></div>
</div>

<script type="module">
  import { auth, db } from './assets/js/firebase-config.js';
  import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { syncProfileToLocal } from './assets/js/luxe-auth.js';

  const form      = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const spinner   = document.getElementById('spinner');
  const btnText   = document.getElementById('btnText');
  const msg       = document.getElementById('msg');
  const msgText   = document.getElementById('msgText');

  function showMsg(text, type = 'error') {
    msg.className = 'msg ' + type;
    msgText.textContent = text;
  }
  function setLoading(on) {
    submitBtn.disabled = on;
    spinner.style.display = on ? 'inline-block' : 'none';
    btnText.textContent = on ? 'Signing in…' : 'Sign In';
  }

  // Already signed in? Skip straight to the account page.
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    window.location.href = 'account.html';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    if (!email || !password) return showMsg('Please fill in all fields.');

    setLoading(true);

    try {
      await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);

      const { user } = await signInWithEmailAndPassword(auth, email, password);

      const ref = doc(db, 'luxeshop_users', user.uid);
      const snap = await getDoc(ref);
      const fsProfile = snap.exists() ? snap.data() : { email: user.email, displayName: user.displayName };

      updateDoc(ref, { lastLogin: serverTimestamp() }).catch(() => {});

      // Pre-populate account.html's localStorage profile so the
      // account page renders the signed-in user immediately.
      syncProfileToLocal(fsProfile, user.uid);

      showMsg('Login successful! Redirecting…', 'success');
      setTimeout(() => { window.location.href = 'account.html'; }, 500);

    } catch (err) {
      console.error('[login] ERROR:', err.code, err.message);
      setLoading(false);
      const msgs = {
        'auth/user-not-found':         'No account found with this email.',
        'auth/wrong-password':         'Incorrect password. Please try again.',
        'auth/invalid-email':          'Please enter a valid email address.',
        'auth/too-many-requests':      'Too many attempts. Please try again later.',
        'auth/invalid-credential':     'Invalid email or password.',
        'auth/network-request-failed': 'Network error. Check your connection and try again.',
      };
      showMsg(msgs[err.code] || `Login failed: ${err.message}`);
    }
  });
</script>
</body>
</html>
